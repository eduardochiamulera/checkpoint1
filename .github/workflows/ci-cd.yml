name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

env:
  DOTNET_VERSION: '9.0.x'
  SOLUTION: Cursos.Architecture.sln
  API_PROJECT: src/Cursos.API/Cursos.API.csproj
  TESTS_PROJECT: tests/Cursos.Tests.csproj
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-test:
    name: Restore, Build & Test
    runs-on: ubuntu-latest
    env:
      # Testcontainers precisa de um Docker daemon acessivel.
      # Runners ubuntu-latest ja tem Docker instalado e o socket disponivel por padrao,
      # sem necessidade de montar volumes ou subir servicos adicionais.
      DOCKER_HOST: unix:///var/run/docker.sock
      # Evita que o Ryuk (container de limpeza do Testcontainers) trave em ambientes
      # efemeros/restritos do runner; o proprio job do Actions ja limpa os containers ao final.
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Verify Docker environment (required by Testcontainers)
        run: |
          docker version
          docker info
          echo "Docker daemon is reachable at $DOCKER_HOST"

      - name: Restore
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION }} -c Release --no-restore

      - name: Test
        run: >
          dotnet test ${{ env.TESTS_PROJECT }}
          -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory ./TestResults

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ./TestResults
          retention-days: 15

      - name: Publish API artifact
        run: >
          dotnet publish ${{ env.API_PROJECT }}
          -c Release
          -o ./publish
          --no-restore

      - name: Upload API artifact
        uses: actions/upload-artifact@v4
        with:
          name: cursos-api-artifact
          path: ./publish
          retention-days: 15

  docker-build-push:
    name: Build & Push Docker Image
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

  smoke-test:
    name: Smoke Test (docker-compose)
    needs: docker-build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create .env for smoke test
        run: |
          cat <<EOF > .env
          API_PORT=8080
          ASPNETCORE_ENVIRONMENT=Production
          MYSQL_PORT=3306
          MYSQL_DATABASE=cursos
          MYSQL_USER=cursos_app
          MYSQL_PASSWORD=${{ secrets.SMOKE_MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD=${{ secrets.SMOKE_MYSQL_ROOT_PASSWORD }}
          JWT_SECRET_KEY=${{ secrets.SMOKE_JWT_SECRET_KEY }}
          JWT_ISSUER=CursosAPI
          JWT_AUDIENCE=CursosUsers
          JWT_EXPIRATION_MINUTES=60
          PAYMENT_GATEWAY_TYPE=Simulated
          EOF

      - name: Start stack
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://localhost:8080/health; then
              echo "API is healthy"
              exit 0
            fi
            echo "Waiting for API... ($i/20)"
            sleep 5
          done
          echo "API did not become healthy in time"
          docker compose logs
          exit 1

      - name: Smoke test - critical endpoints
        run: |
          curl -fsS http://localhost:8080/health/ready
          curl -fsS -X POST http://localhost:8080/api/auth/register \
            -H "Content-Type: application/json" \
            -d '{"email":"smoke-test@example.com","password":"SmokeTest123!","name":"Smoke Test"}' || true

      - name: Dump logs on failure
        if: failure()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
